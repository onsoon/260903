<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeAT 실습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body { margin: 0; }
/* Layout: 한 줄 탭 + 단일 작업 열. 휴대폰으로 수업 중에 쓰는 실습 도구 */
:root {
  --bg: #f3f6fb; --surface: #ffffff; --ink: #17223a; --muted: #56637c; --line: #dce3ee;
  --blue: #2160d6; --blue-soft: #e3ecfc; --pink: #c93468; --pink-soft: #fbe5ed;
  --yellow: #9a6a00; --yellow-soft: #fff3d1; --green: #2f7d33; --green-soft: #e3f2e3;
  --display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1524; --surface: #162036; --ink: #e7ecf6; --muted: #9ba8c1; --line: #2a3651;
  --blue: #79a7ff; --blue-soft: #1b2c50; --pink: #ff86ad; --pink-soft: #3a1d2b;
  --yellow: #f6c851; --yellow-soft: #392f15; --green: #82cf85; --green-soft: #1c321f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1524; --surface: #162036; --ink: #e7ecf6; --muted: #9ba8c1; --line: #2a3651;
  --blue: #79a7ff; --blue-soft: #1b2c50; --pink: #ff86ad; --pink-soft: #3a1d2b;
  --yellow: #f6c851; --yellow-soft: #392f15; --green: #82cf85; --green-soft: #1c321f; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
h1 { font-size: 34px; line-height: 1.15; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

header.top { display: grid; gap: 8px; margin-bottom: 20px; }
.eyebrow { font-size: 13px; letter-spacing: .06em; color: var(--blue); font-weight: 700; }
.lede { color: var(--muted); max-width: 60ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); }
.chip b { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.tab-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tab-row::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.tab .n { font-family: var(--display); color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] .n { color: inherit; }
.tab .done { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

section.panel { display: grid; gap: 16px; }
.panel-head { display: grid; gap: 4px; }
.panel-head .time { font-size: 13px; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.note { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.note.warn { background: var(--yellow-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--yellow) 40%, transparent); }
.note.info { background: var(--blue-soft); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 퀴즈 */
.quiz-card { display: grid; gap: 12px; }
.quiz-q { font-size: 18px; font-weight: 500; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ox button { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-family: var(--display); font-size: 28px; cursor: pointer; }
.ox button.o { color: var(--blue); }
.ox button.x { color: var(--pink); }
.ox button[data-picked="true"] { border-color: currentColor; }
.verdict { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.verdict.right { background: var(--green-soft); }
.verdict.wrong { background: var(--pink-soft); }
.verdict strong { font-family: var(--display); font-weight: 400; font-size: 18px; }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-weight: 700; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots span { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.dots span.ok { background: var(--green); }
.dots span.no { background: var(--pink); }
.dots span.now { background: var(--ink); }

/* 체크리스트 */
.checks { display: grid; gap: 8px; list-style: none; padding: 0; margin: 0; }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; background: var(--surface); }
.checks input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--blue); flex: none; }
.checks small { display: block; color: var(--muted); }
.opts label.off { opacity: .45; cursor: not-allowed; }
.pledge-done { text-align: center; padding: 16px; border-radius: 14px; background: var(--green-soft); font-family: var(--display); font-size: 20px; }

/* 단계 */
.steps { display: grid; gap: 10px; counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--display); font-size: 18px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); }
.steps .body { display: grid; gap: 4px; min-width: 0; padding-top: 6px; }
.steps .body small { color: var(--muted); }
.url { font-family: var(--mono); font-size: 15px; background: var(--blue-soft); padding: 2px 8px; border-radius: 6px; word-break: break-all; }

/* 프롬프트 만들기 */
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .builder { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.field .key { font-family: var(--display); font-weight: 400; font-size: 13px; padding: 0 8px; border-radius: 6px; color: var(--surface); }
.k-role { background: var(--blue); } .k-ctx { background: var(--green); } .k-ask { background: var(--pink); } .k-fmt { background: var(--yellow); }
input[type="text"], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; }
textarea { resize: vertical; min-height: 80px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; background: var(--surface); }
.opts input { accent-color: var(--blue); }
.preview { font-family: var(--body); white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; min-height: 160px; font-size: 15px; word-break: break-word; }
.score { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.score div { font-size: 12px; text-align: center; padding: 6px 4px; border-radius: 8px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.score div.on { color: var(--ink); background: var(--green-soft); border-color: transparent; font-weight: 700; }

/* 고쳐쓰기 비교 */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .compare { grid-template-columns: 1fr; } }
.compare .bad, .compare .good { border-radius: 12px; padding: 12px; display: grid; gap: 4px; min-width: 0; }
.compare .bad { background: var(--pink-soft); }
.compare .good { background: var(--green-soft); }
.compare b { font-size: 13px; }

/* 미션 */
.mission { display: grid; gap: 10px; }
.mission-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.mission-head .lv { font-family: var(--display); color: var(--blue); }
.prompt-block { position: relative; background: var(--bg); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; border-left: 4px solid var(--blue); font-size: 14.5px; }
.prompt-block mark { background: var(--yellow-soft); color: var(--ink); border-radius: 4px; padding: 0 3px; }
.fact { display: grid; gap: 6px; }
.fact label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.fact input { accent-color: var(--green); width: 18px; height: 18px; flex: none; margin-top: 2px; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; }

/* 공감 한 줄 + 자료 */
.pain { font-size: 14px; color: var(--pink); font-weight: 700; }
.files { display: grid; gap: 8px; background: var(--bg); border-radius: 12px; padding: 12px; }
.file-row { display: grid; gap: 6px; }
.file { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.file:hover { border-color: var(--blue); }
.ext { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; flex: none; }
.ext-docx { background: var(--blue-soft); color: var(--blue); }
.ext-txt { background: var(--green-soft); color: var(--green); }
.ext-csv { background: var(--yellow-soft); color: var(--yellow); }
.fname { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.fsize { font-size: 12px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.peek pre { white-space: pre-wrap; font-family: var(--body); font-size: 13px; max-height: 260px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 6px 0; }
/* Agent 새로 만들기 입력 예시 */
.ag-form { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px; display: grid; gap: 10px; }
.ag-title { font-weight: 700; font-size: 16px; }
.ag-title small { font-weight: 400; color: var(--muted); font-size: 12px; }
.ag-sec { background: var(--blue-soft); color: var(--blue); text-align: center; border-radius: 6px; padding: 4px; font-size: 13px; font-weight: 700; }
.ag-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: start; }
@media (max-width: 520px) { .ag-row { grid-template-columns: 1fr; gap: 4px; } }
.ag-label { font-size: 13px; font-weight: 700; padding-top: 8px; }
.ag-label .req { color: var(--pink); }
.ag-val { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; min-width: 0; background: var(--bg); }
.ag-val > span, .ag-val > pre, .ag-val > ul { flex: 1; min-width: 0; }
.ag-val .ag-pre { display: block; }
.ag-pre { white-space: pre-wrap; font-family: var(--body); font-size: 13.5px; margin: 0; line-height: 1.55; }
.ag-starts { margin: 0; padding-left: 18px; }
.ag-copy { flex: none; padding: 4px 10px; font-size: 13px; }
.ag-note { color: var(--muted); font-size: 12.5px; }
.ag-val small.ok { color: var(--green); }
.ag-val small.over { color: var(--pink); font-weight: 700; }
/* BeAT 화면을 본뜬 메뉴 막대 */
.beat-bar { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; overflow-x: auto; }
.beat-logo { font-family: var(--body); font-weight: 700; font-size: 22px; letter-spacing: -.02em; flex: none; }
.beat-logo i { color: var(--blue); font-style: italic; }
.beat-menus { display: flex; gap: 4px; margin-left: auto; }
.beat-menus button { flex: none; border: 0; background: none; padding: 12px 10px; cursor: pointer; font-size: 15px; border-bottom: 3px solid transparent; color: var(--ink); white-space: nowrap; }
.beat-menus button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
.done-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); vertical-align: middle; }
.path { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; padding: 0; margin: 0; font-size: 13px; }
.path li { background: var(--blue-soft); color: var(--ink); padding: 3px 10px; border-radius: 999px; }
.path li + li::before { content: "→ "; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .panel { animation: in .2s ease-out; } @keyframes in { from { opacity: .6; transform: translateY(4px); } } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">부산교육 AI 튜터 BeAT · 1차시 실습</span>
    <h1>BeAT 실습실</h1>
    <p class="lede">윤리 퀴즈로 시작해서, 접속하고, 질문을 만들고, 직접 물어본 다음, 답이 맞는지 확인하는 데까지. 선생님이 안내하는 순서대로 탭을 넘기세요.</p>
    <div class="meta-row">
      <span class="chip">퀴즈 <b id="chipQuiz">0/8</b></span>
      <span class="chip">안전 약속 <b id="chipPledge">0/5</b></span>
      <span class="chip">메뉴 실습 <b id="chipMission">0/4</b></span>
    </div>
  </header>

  <nav class="tabs" aria-label="실습 단계">
    <div class="tab-row" role="tablist" id="tabRow"></div>
  </nav>

  <main id="panels"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const BEAT_URL = "https://beat.busanedu.net";

const QUIZ = [
  { q: "국어 수행평가 감상문을 AI에게 써 달라고 한 뒤, 이름만 바꿔서 그대로 냈다.", a: false, tag: "학업 윤리",
    why: "AI가 만든 글을 그대로 내면 내 생각이 아니에요. 아이디어를 얻는 데 쓰고, 글은 내가 직접 쓰고 고쳐야 해요." },
  { q: "수학 문제에서 막혀서 “정답은 말하지 말고 힌트만 한 단계씩 줘”라고 물었다.", a: true, tag: "똑똑한 활용",
    why: "답을 받아 적는 대신 스스로 풀 수 있게 도와 달라고 했어요. AI를 과외 선생님처럼 쓰는 좋은 방법이에요." },
  { q: "진로 상담을 받으려고 내 이름, 학교, 전화번호, 생활기록부 내용을 그대로 붙여 넣었다.", a: false, tag: "개인정보",
    why: "학교생활기록부, 전화번호, 건강정보 같은 개인정보는 입력하지 않아요. “관심 분야가 ○○인 고1”처럼 바꿔서 물어보면 충분해요." },
  { q: "AI가 알려 준 역사 사건 연도를 교과서로 확인했더니 달랐다. 교과서 내용을 따랐다.", a: true, tag: "사실 확인",
    why: "AI는 틀린 내용을 그럴듯하게 말할 때가 있어요(할루시네이션). 교과서나 믿을 수 있는 자료로 다시 확인하는 게 정답이에요." },
  { q: "친구 얼굴 사진을 허락 없이 올려서 웃긴 합성 이미지를 만들고 단톡방에 공유했다.", a: false, tag: "초상권·딥페이크",
    why: "다른 사람의 얼굴은 그 사람의 것이에요. 장난이어도 허락 없는 합성과 공유는 상처를 주고, 법적인 문제가 될 수 있어요." },
  { q: "발표 자료에 AI로 만든 그림을 넣고 아래에 “AI 생성 이미지(BeAT)”라고 적었다.", a: true, tag: "출처 표시",
    why: "AI로 만든 결과물이나 다른 사람의 글·그림을 쓸 때는 출처를 밝혀요. 듣는 사람도 무엇이 AI 작품인지 알 수 있어요." },
  { q: "AI가 너무 자신 있게 말해서, 확인하지 않고 그대로 외워 시험 공부를 했다.", a: false, tag: "사실 확인",
    why: "말투가 자신 있다고 내용이 맞는 건 아니에요. 중요한 내용일수록 교과서나 선생님께 확인해요." },
  { q: "AI가 이상하고 불편한 답을 해서 캡처해 두고 선생님께 알렸다.", a: true, tag: "신고하기",
    why: "불편하거나 이상한 답변이 나오면 선생님이나 운영진에게 알려요. 그래야 모두가 더 안전하게 쓸 수 있어요." },
];

const PLEDGE = [
  ["개인정보를 입력하지 않아요.", "학교생활기록부, 전화번호, 건강정보, 주소, 친구 이름"],
  ["AI 답변이 정확한지 다시 확인해요.", "교과서나 믿을 수 있는 자료와 비교하기"],
  ["다른 사람의 글과 이미지를 쓸 때 출처를 표시해요.", "AI로 만든 결과물에도 표시하기"],
  ["AI가 만든 내용을 그대로 제출하지 않아요.", "직접 확인하고, 내 말로 고쳐 쓰기"],
  ["불편하거나 이상한 답변은 선생님께 알려요.", "캡처해 두고 선생님이나 운영진에게"],
];

// 안전 약속을 그림으로: 약속마다 장면과 짧은 문구
const ART = {
  scene: [

 분해: 미생물이 사체와 배설물을 분해해 이산화 탄소를 내보낸다. (생물권 → 대기, 토양)\n- 연소: 화석 연료를 태우면 오랫동안 땅속에 있던 탄소가 이산화 탄소가 되어 대기로 나온다. (지권 → 대기)\n- 해양의 흡수와 방출: 바다는 대기의 이산화 탄소를 녹여 흡수하기도 하고 내보내기도 한다. (대기 ↔ 수권)\n- 퇴적: 생물의 유해와 탄산염이 아주 오랜 시간 쌓여 암석과 화석 연료가 된다. (생물권·수권 → 지권)\n\n3. 온실 효과\n태양 빛을 받아 데워진 지표는 적외선을 내보낸다. 대기 중의 온실 기체(수증기, 이산화 탄소, 메테인 등)는 이 적외선의 일부를 흡수했다가 다시 지표 쪽으로 내보낸다. 이 덕분에 지구의 평균 기온은 약 15 °C로 유지된다. 온실 효과가 없다면 지구 평균 기온은 약 -18 °C까지 내려갈 것으로 계산된다.\n즉, 온실 효과 자체는 생명이 살 수 있게 해 주는 자연스러운 현상이다.\n\n4. 지구 온난화\n산업 혁명 이후 화석 연료 사용과 숲의 감소로 대기 중 온실 기체가 늘어났다. 대기 중 이산화 탄소 농도는 산업 혁명 이전 약 280 ppm에서 최근 420 ppm을 넘었다. 온실 기체가 늘어 온실 효과가 강해지면서 지구 평균 기온이 올라가는 현상을 지구 온난화라고 한다.\n- 해수면 상승: 빙하가 녹고, 바닷물이 데워지며 부피가 늘어난다(열팽창).\n- 이상 기후: 폭염, 집중 호우, 가뭄이 더 자주, 더 강하게 나타난다.\n- 생태계 변화: 생물이 사는 지역이 바뀌고, 개화 시기가 달라진다.\n- 해양 산성화: 바다에 녹는 이산화 탄소가 늘어 바닷물이 산성 쪽으로 변한다.\n\n5. 자주 헷갈리는 개념\n- 온실 효과 ≠ 지구 온난화: 온실 효과는 원래 있던 자연 현상이고, 지구 온난화는 온실 효과가 강해져 기온이 올라가는 현상이다.\n- 광합성과 호흡은 정반대 방향의 이동이다. 식물도 호흡을 한다.\n- 화석 연료의 탄소는 원래 생물의 몸에 있던 탄소다.\n\n6. 확인 문제\n1. 대기의 탄소를 생물권으로 옮기는 과정은 무엇인가?\n2. ‘온실 효과는 나쁜 현상이므로 없어져야 한다.’ 이 문장의 잘못된 점을 설명하시오.\n3. 해수면이 상승하는 원인 두 가지를 쓰시오.\n정답: 1. 광합성  2. 온실 효과가 없으면 지구 평균 기온이 약 -18 °C가 되어 생물이 살기 어렵다. 문제는 온실 효과가 지나치게 강해진 것(지구 온난화)이다.  3. 빙하가 녹아 바다로 흘러드는 것, 바닷물이 데워져 부피가 늘어나는 것(열팽창)\n"}, "math_docx": {"name": "개인GPT_수학_오답노트.docx", "size": "37KB", "b64": "UEsDBBQAAAAIAM5uUl2tUqWRlQEAAMoGAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbLWVTU/bQBCG7/0Vli8+IHtDDxWq4nAocCyRGkSvm/U4Wdgv7UwC+ffMOolV0VCHBi6RnJn3fR7bsj2+fLYmW0NE7V1dnFejIgOnfKPdoi7uZjflRZEhSddI4x3UxQawuJx8Gc82ATDjsMM6XxKF70KgWoKVWPkAjietj1YSH8aFCFI9ygWIr6PRN6G8I3BUUurIJ+MraOXKUHb9zH93IvlDgEWe/dguJlada5sKuoE4mIlg8FVGhmC0ksRzsXbNK7NyZ1VxstvBpQ54xgtvENLkbcAud8tXM+oGsqmM9FNa3hJqheTtb2uEJrDT6AOeV/9uO6Dr21YraLxaWY5UfWnqg0gaevdDDpzrwIIpJ7MhXZQGmjK8j618hPfD9/cppY8kPvnYiF731NNNbcxVgMgPhjVVP7FSu0GPlskzOTf/cepDIn31oIRb2TlETn28RF89KIFAxHv48Q775mEF2hj4DIGu90j8vabldduComNMLJYpW/2VHaQRv5Fh+3v6C6erGUQ+wfzXp93lP8r3IqL7FE1eAFBLAwQUAAAACADOblJdeSZLQPgAAADeAgAACwAAAF9yZWxzLy5yZWxzrZLNSgMxEIDvPkXIJadutlVEpNleROhN 는 P(-2) 이다.\n2. P(-2) = (-2)³ - 2·(-2)² + 3·(-2) - 4\n3. = -8 - 8 - 6 - 4\n4. 내 답: 나머지는 -26\n\n오답 3. 이차부등식\n문제: 이차부등식 x² - x - 6 < 0 의 해를 구하시오.\n1. 좌변을 인수분해하면 (x - 3)(x + 2) < 0\n2. x = 3, x = -2 가 경계이다.\n3. 내 답: x < -2 또는 x > 3\n\n정답 확인용 (AI와 먼저 풀어 본 뒤에 보기)\n- 오답 1: x = 1 또는 x = 5 (3단계에서 -b 는 +6 이어야 함)\n- 오답 2: 나머지는 P(2) = 2 (x - a 로 나눈 나머지는 P(a))\n- 오답 3: -2 < x < 3 (곱이 음수이면 두 근 사이)\n"}, "bimun": {"name": "개인GPT_비문학지문_추천알고리즘.txt", "size": "2KB", "text": "[비문학 지문] 내 피드는 왜 나만 보는 것으로 가득할까\nBeAT 1차시 실습용 예시 자료 · 수업 연습을 위해 새로 쓴 지문입니다.\n\n동영상 앱을 켜면 첫 화면에 내가 좋아할 만한 영상이 줄지어 나온다. 어제 고양이 영상을 두 개 봤다면 오늘은 고양이 영상이 열 개쯤 보인다. 이것은 우연이 아니라 추천 알고리즘이 작동한 결과다.\n\n추천 알고리즘은 사용자가 남긴 흔적을 모아 다음에 보여 줄 콘텐츠를 고른다. 흔적에는 무엇을 클릭했는지, 영상을 몇 초까지 봤는지, ‘좋아요’를 눌렀는지, 어떤 시간대에 앱을 켰는지 같은 정보가 들어간다. 알고리즘은 이런 기록이 비슷한 다른 사용자들이 무엇을 좋아했는지도 함께 살핀다. 나와 취향이 비슷한 사람들이 즐겨 본 영상이라면 나도 좋아할 가능성이 높다고 판단하는 것이다. 이렇게 하면 사용자는 원하는 콘텐츠를 빨리 찾을 수 있고, 서비스는 사용자가 더 오래 머물게 할 수 있다.\n\n그러나 편리함에는 그림자가 있다. 알고리즘이 내가 이미 좋아하는 것만 계속 보여 주면, 나는 점점 비슷한 정보와 의견에만 둘러싸이게 된다. 이처럼 맞춤형 정보가 보이지 않는 막처럼 사용자를 감싸 다른 정보를 걸러 내는 현상을 ‘필터 버블’이라고 부른다. 필터 버블 안에서는 내 생각과 다른 의견을 만날 기회가 줄어들고, 세상 사람들 대부분이 나와 같은 생각을 한다고 착각하기 쉽다. 한쪽으로 치우친 정보만 반복해서 보면 생각이 더 굳어지기도 한다.\n\n필터 버블에서 벗어나려면 무엇이 필요할까? 먼저 내가 보는 화면이 ‘모두에게 같은 화면’이 아니라는 사실을 아는 것이 출발점이다. 그다음 일부러 다른 분야의 콘텐츠를 찾아보거나, 같은 사건을 다룬 여러 매체의 기사를 비교해 보는 습관이 도움이 된다. 시청 기록을 정리하거나 추천 설정을 바꾸는 것도 방법이다. 알고리즘은 내가 남긴 흔적으로 움직이므로, 내가 어떤 흔적을 남길지 스스로 고르는 것이 곧 내 피드를 바꾸는 일이다.\n\n추천 알고리즘은 그 자체로 좋거나 나쁜 도구가 아니다. 도구를 쓰는 사람이 그 원리를 알고 있을 때, 편리함은 누리면서 그림자는 줄일 수 있다.\n"}, "csv": {"name": "AIAgents_가상설문_스마트폰과수면.csv", "size": "898B", "text": "﻿번호,학년,하루_스마트폰_사용시간(시간),잠들기전_스마트폰_사용(분),평일_수면시간(시간),아침_피곤함(1~5)\r\n1,1,3.9,45,5.7,5\r\n2,1,5.8,35,6.7,3\r\n3,1,4.0,25,8.0,3\r\n4,1,4.8,45,5.9,3\r\n5,3,4.2,35,6.6,3\r\n6,1,3.2,10,7.6,3\r\n7,1,3.1,5,6.8,2\r\n8,3,4.8,40,6.9,3\r\n9,2,4.7,50,6.5,3\r\n10,1,6.4,55,5.7,4\r\n11,2,3.8,40,6.7,3\r\n12,1,5.7,100,6.0,4\r\n13,2,4.6,45,7.1,3\r\n14,2,4.4,55,6.0,3\r\n15,1,4.7,40,6.5,3\r\n16,2,3.2,30,6.7,3\r\n17,3,3.2,35,6.1,4\r\n18,2 e evening can delay melatonin even more.\n\n[번역 연습 과제]\n1. Custom AI → 문서번역에 ‘CustomAI_영어지문_번역연습.docx’를 올려 번역해 보세요. (번역하기 전에 첫 문단은 내가 먼저 해석!)\n2. 원문과 번역문을 한 문장씩 비교해서, 어색하거나 뜻이 달라진 문장을 하나 찾아보세요.\n3. 지문의 핵심 단어 3개(예: circadian rhythm)를 골라 뜻을 정리하세요.\n"}, "eng_docx": {"name": "CustomAI_영어지문_번역연습.docx", "size": "36KB", "b64": "UEsDBBQAAAAIAM5uUl2tUqWRlQEAAMoGAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbLWVTU/bQBCG7/0Vli8+IHtDDxWq4nAocCyRGkSvm/U4Wdgv7UwC+ffMOolV0VCHBi6RnJn3fR7bsj2+fLYmW0NE7V1dnFejIgOnfKPdoi7uZjflRZEhSddI4x3UxQawuJx8Gc82ATDjsMM6XxKF70KgWoKVWPkAjietj1YSH8aFCFI9ygWIr6PRN6G8I3BUUurIJ+MraOXKUHb9zH93IvlDgEWe/dguJlada5sKuoE4mIlg8FVGhmC0ksRzsXbNK7NyZ1VxstvBpQ54xgtvENLkbcAud8tXM+oGsqmM9FNa3hJqheTtb2uEJrDT6AOeV/9uO6Dr21YraLxaWY5UfWnqg0gaevdDDpzrwIIpJ7MhXZQGmjK8j618hPfD9/cppY8kPvnYiF731NNNbcxVgMgPhjVVP7FSu0GPlskzOTf/cepDIn31oIRb2TlETn28RF89KIFAxHv48Q775mEF2hj4DIGu90j8vabldduComNMLJYpW/2VHaQRv5Fh+3v6C6erGUQ+wfzXp93lP8r3IqL7FE1eAFBLAwQUAAAACADOblJdeSZLQPgAAADeAgAACwAAAF9yZWxzLy5yZWxzrZLNSgMxEIDvPkXIJadutlVEpNleROhNpD7AmMzupm5+SKbavr1RRF1YFsEe5+/jY2bWm6Mb2CumbINXYlnVgqHXwVjfKfG0u1/cCJYJvIEheFTihFlsmov1Iw5AZSb3NmZWID4r3hPFWymz7tFBrkJEXyptSA6ohKmTEfQLdChXdX0t028Gb0ZMtjWKp6255Gx3ivg/tnRIYIBA6pBwEVOZTmQxFzikDklxE/RDSefPjqqQuZwWuvq7UGhbq/Eu6INDT1NeeCT0Bs28EsQ4Z7Q8p9G440fmLSQjzVd6zmZ13oNRf3DPHuwwsZfvWrWP2H0IydFbNu9QSwMEFAAAAAgAzm5SXYiGC1NpAQAA0QIAABEAAABkb2NQcm9wcy9jb3JlLnhtbJ2Sy07DMBBF93xF1E1WifMQCEVJKgHqikpIFIHYufY0NU1sy542zd/jpG1aoCt2Ht87x/NwPt03tbcDY4WShR+Hke+BZIoLWRX+22IW3PueRSo5rZWEwu/A+tPyJmc6Y8rAi1EaDAqwngNJmzFdTNaIOiPEsjU01IbOIZ24Uqah6EJTEU3ZhlZAkii6Iw0g5RQp6YGBHomTI5KzEam3ph4AnBGooQGJlsRhTM5eBNPYqwmDcuFsBHYarlpP4ujeWzEa27YN23Swuvpj8jF/fh1aDYTsR8VgUuacZSiwBjIc7Xb5BQwPATNAUZlSd7hWMuCK7XNycd/PdgNdqwy3hwwOlhmh0e2orECCoQjcW3beb8SlscfU1OLcLXMlgD90ZLgzsBP9tss4J5dhfpzdoQ7Hdz1nhwmdlPf08Wkxm5RJFKdBnARJukjSLL7Nouizf/9H/hnYHCv4N/EEGOpnDl4p03dD/vzC8htQSwMEFAAAAAgAzm5SXfTb2xfrAQAAbAQAABAAAABkb2NQcm9wcy9hcHAueG1snVTLbtswELz7KwRddIppB0FRGJKC1kHRQ90asJKct9TKIkqRBLkx4n59+YgVOYYv9Yk7szv7tMr710FmB const load = (k, d) => { try { const v = localStorage.getItem("beat1:" + k); return v ? JSON.parse(v) : d; } catch { return d; } };

  tab: load("tab", "quiz"),

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 1600);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했어요. BeAT 입력창에 붙여 넣으세요."); }
  catch { toast("복사가 막혔어요. 글을 길게 눌러 직접 복사해 주세요."); }
}

function itemDone(i, j) { return MISSIONS[i].items[j].check.every((_, k) => state.facts[`${i}-${j}:${k}`]); }
function missionDone(i) { return MISSIONS[i].items.some((_, j) => itemDone(i, j)); }
function tabDone(id) {
  if (id === "quiz") return Object.keys(state.quiz).length === QUIZ.length;
  if (id === "pledge") return state.pledge.length === PLEDGE.length;
  if (id === "login") return state.login.length === STEPS.length;
  if (id === "mission") return missionDone(0) && MISSIONS.some((_, i) => i > 0 && missionDone(i));
  if (id === "review") return state.review.q1 && state.review.q2 && state.review.q3;
  return false;
}

function renderChrome() {
  const score = QUIZ.filter((q, i) => state.quiz[i] === q.a).length;
  $("#chipQuiz").textContent = `${Object.keys(state.quiz).length}/8 · 정답 ${score}`;
  $("#chipPledge").textContent = `${state.pledge.length}/5`;
  $("#chipMission").textContent = `${MISSIONS.filter((_, i) => missionDone(i)).length}/4`;
  $("#tabRow").innerHTML = TABS.map(t => `
    <button class="tab" role="tab" id="tab-${t.id}" aria-selected="${state.tab === t.id}" data-tab="${t.id}">
      <span class="n">${t.n}</span>${t.label}${tabDone(t.id) ? '<span class="done" aria-label="완료"></span>' : ""}
    </button>`).join("");
}

function head(id, title, desc) {
  const t = TABS.find(x => x.id === id);
  return `<div class="panel-head"><span class="time">${t.n}단계 · 약 ${t.time}</span><h2>${title}</h2><p class="lede">${desc}</p></div>`;
}

  }
  // 아티팩트 밖(학교 서버 등)에서는 브라우저 기본 다운로드
  const type = f.b64 ? "application/vnd.openxmlformats-officedocument.wordprocessingml.document" : (f.name.endsWith(".csv") ? "text/csv;charset=utf-8" : "text/plain;charset=utf-8");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = f.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function showPeek(key) {
  const twin = FILES[key].twin || key;
  const d = document.getElementById("peek-" + twin);
  toast("이 화면에서는 파일 저장이 막혀 있어요. 미리보기의 ‘본문 복사’로 붙여 넣어 쓰세요.");
  if (d) { d.open = true; d.scrollIntoView({ block: "center" }); }
}

function artPicks() {
  const picks = state.art.picks.filter(k => state.pledge.includes(k)).sort();
  return picks.length ? picks : [...state.pledge].sort();
}
function artPrompt() {
  const a = state.art, picks = artPicks();
  if (!picks.length) return "";
  const lines = [];
  if (picks.length === 1) {
    lines.push(`${ART.styles[a.style]}로 그림을 그려 줘.`, `주제: BeAT 안전 사용 약속 ‘${PLEDGE[picks[0]][0]}’`, `장면: ${ART.scene[picks[0]]}`);
  } else {
    lines.push(`${ART.styles[a.style]}로 ${picks.length}컷 만화를 그려 줘. 컷마다 BeAT 안전 사용 약속을 하나씩 보여 줘.`);
    picks.forEach((k, i) => lines.push(`${i + 1}컷 (${ART.short[k]}): ${ART.scene[k]}`));
  }
  lines.push(
    "등장인물: 교복을 입은 한국 고등학생(실제 인물이 아닌 캐릭터)과 친근한 파란색 AI 로봇 튜터 ‘비트’",
    `분위기: ${ART.moods[a.mood]} 느낌`,
    `화면 비율: ${ART.layouts[a.layout]}`,
    "색감: 파란색과 분홍색 포인트, 깔끔한 흰 배경",
    a.text
      ? (picks.length === 1 ? `글자: 그림 위쪽에 ‘${ART.short[picks[0]]}’라는 짧은 한글 문구를 넣어 줘.` : `글자: 컷마다 아래쪽에 짧은 한글 문구를 넣어 줘. (${picks.map(k => ART.short[k]).join(" / ")})`)
      : "글자: 그림 안에는 글자를 넣지 마. 문구는 내가 나중에 직접 넣을게.",
    "조건: 실제 사람 얼굴, 연예인, 유명 만화 캐릭터는 쓰지 마. 학교 게시판에 붙일 수 있게 밝고 안전한 그림으로 그려 줘.");
  return lines.join("\n");
}
function artBox() {
  const a = state.art;
  if (!state.pledge.length) return `<div class="box"><h3>약속을 그림으로 만들어 볼까요?</h3><p class="lede">위에서 약속을 하나 이상 체크하면 이미지 생성 프롬프트를 만들 수 있어요.</p></div>`;
  const picks = artPicks();
  const radio = (name, list, cur) => `<div class="opts">${list.map((o, k) => `<label><input type="radio" name="${name}" data-art="${name}" value="${k}" ${k === cur ? "checked" : ""}>${o}</label>`).join("")}</div>`;
  return `<div class="box art">
    <h3>약속을 그림으로: 이미지 생성 프롬프트 만들기</h3>
    <p class="lede" style="font-size:14px">체크한 약속으로 학급 게시판 포스터나 컷 만화를 만들어요. 약속 하나를 고르면 한 장면, 여러 개를 고르면 컷 만화가 돼요.</p>
    <div class="field"><span>1. 그림에 담을 약속 (체크한 약속만 고를 수 있어요)</span>
      <div class="opts">${PLEDGE.map(([t], k) => `<label class="${state.pledge.includes(k) ? "" : "off"}"><input type="checkbox" data-artpick="${k}" ${state.pledge.includes(k) ? "" : "disabled"} ${picks.includes(k) && state.pledge.includes(k) ? "checked" : ""}>${ART.short[k]}</label>`).join("")}</div></div>
    <div class="field"><span>2. 그림 스타일</span>${radio("style", ART.styles, a.style)}</div>
    <div class="field"><span>3. 분위기</span>${radio("mood", ART.moods, a.mood)}</div>
    <div class="field"><span>4. 화면 비율</span>${radio("layout", ART.layouts, a.layout)}</div>
    <label class="row" style="font-size:14px;cursor:pointer"><input type="checkbox" id="art-text" ${a.text ? "checked" : ""} style="accent-color:var(--blue)"> 그림 안에 짧은 한글 문구 넣기</label>
    <small style="color:var(--muted)">AI 이미지는 한글 글자가 깨질 때가 많아요. 깨지면 글자 없이 다시 만들고, 문구는 발표 자료에서 직접 넣으세요.</small>
    <h3 style="margin-top:4px">완성된 프롬프트 <span class="tag">${picks.length === 1 ? "한 장면" : picks.length + "컷 만화"}</span></h3>
    <div class="preview" id="artPreview">${esc(artPrompt())}</div>
    <div class="row"><button class="btn primary" id="copyArt">프롬프트 복사</button><a class="btn" href="${BEAT_URL}" target="_blank" rel="noopener" style="text-decoration:none">BeAT 열기</a></div>
    <small style="color:var(--muted)">BeAT 개인GPT에 붙여 넣어 이미지를 만들어요. 이미지 생성이 되는 메뉴는 선생님 안내를 따르세요.</small>
    <div class="fact"><b style="font-size:14px">그림을 받은 다음 확인하기</b>${ART.after.map((c, k) => `
      <label><input type="checkbox" data-artafter="${k}" ${a.after.includes(k) ? "checked" : ""}>${c}</label>`).join("")}</div>
  </div>`;
}
function saveArt(full) { save("art", state.art); if (full) return render(); const el = document.getElementById("artPreview"); if (el) el.textContent = artPrompt(); }

function builtPrompt() {
  const b = state.build;
  const lines = [];
  if (b.role) lines.push(`너는 ${b.subject} 공부를 도와주는 ${b.role}이야.`);
  if (b.ctx.trim()) lines.push(b.ctx.trim());
  if (b.ask.trim()) lines.push(b.ask.trim());
  if (b.fmt.length) lines.push(`답 형식: ${b.fmt.join(", ")}`);
  if (b.cond.length) lines.push(`조건: ${b.cond.join(" / ")}`);
  return lines.join("\n");
}
function updateBuilder() {
  const b = state.build;
  const parts = [["역할", !!b.role], ["상황", b.ctx.trim().length > 4], ["요청", b.ask.trim().length > 4], ["형식", b.fmt.length > 0]];
  $("#score").innerHTML = parts.map(([n, on]) => `<div class="${on ? "on" : ""}">${n}</div>`).join("");
  $("#preview").textContent = builtPrompt() || "왼쪽 칸을 채우면 여기에 질문이 만들어져요.";
  save("build", b);
}

function render() {
  renderChrome();
  $("#panels").innerHTML = `<section class="panel" role="tabpanel" aria-labelledby="tab-${state.tab}">${views[state.tab]()}</section>`;
  if (state.tab === "build") updateBuilder();
}

function go(tab) { state.tab = tab; save("tab", tab); render(); window.scrollTo({ top: 0 }); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-go],[data-ox],[data-qnav],[data-copy],[data-menu],[data-reset],[data-dl],[data-copyfile],[data-preset],#copyBuilt,#copyReview,#copyArt");
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.ox) { state.quiz[state.qi] = t.dataset.ox === "true"; save("quiz", state.quiz); return render(); }
  if (t.dataset.qnav) { state.qi = Math.max(0, Math.min(QUIZ.length - 1, state.qi + +t.dataset.qnav)); save("qi", state.qi); return render(); }
  if (t.dataset.reset === "quiz") { state.quiz = {}; state.qi = 0; save("quiz", {}); save("qi", 0); return render(); }
  if (t.dataset.menu !== undefined) { state.menu = Math.max(0, Math.min(MISSIONS.length - 1, +t.dataset.menu)); save("menu", state.menu); return render(); }
  if (t.dataset.dl) return downloadFile(t.dataset.dl);
  if (t.dataset.copyfile) return copy(FILES[t.dataset.copyfile].text.replace(/^\ufeff/, ""));
  if (t.dataset.preset !== undefined) { state.build = JSON.parse(JSON.stringify(PRESETS[+t.dataset.preset].b)); save("build", state.build); return render(); }
  if (t.dataset.copy) return copy(t.dataset.copy);
  if (t.id === "copyBuilt") return copy(builtPrompt());
  if (t.id === "copyArt") return copy(artPrompt());
  if (t.id === "copyReview") {
    const r = state.review;
    return copy(`[BeAT 1차시 돌아보기]\n1. 확인이 필요했던 부분: ${r.q1}\n2. 가장 필요한 약속: ${r.q2}\n3. 다음에 해 볼 것: ${r.q3}`);
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.pledge !== undefined) {
    const k = +t.dataset.pledge;
    state.pledge = t.checked ? [...new Set([...state.pledge, k])] : state.pledge.filter(x => x !== k);
    save("pledge", state.pledge); return render();
  }
  if (t.dataset.artpick !== undefined) {
    const k = +t.dataset.artpick, cur = artPicks();
    state.art.picks = t.checked ? [...new Set([...cur, k])] : cur.filter(x => x !== k);
    if (!state.art.picks.length) { t.checked = true; state.art.picks = [k]; return toast("약속을 하나 이상 골라 주세요."); }
    return saveArt(true);
  }
  if (t.dataset.art) { state.art[t.dataset.art] = +t.value; return saveArt(false); }
  if (t.dataset.agtpl !== undefined) { state.agentTpl = +t.dataset.agtpl; save("agentTpl", state.agentTpl); return render(); }
  if (t.id === "art-text") { state.art.text = t.checked; return saveArt(false); }
  if (t.dataset.artafter !== undefined) {
    const k = +t.dataset.artafter;
    state.art.after = t.checked ? [...new Set([...state.art.after, k])] : state.art.after.filter(x => x !== k);
    return saveArt(false);
  }
  if (t.dataset.login !== undefined) {
    const k = +t.dataset.login;
    state.login = t.checked ? [...new Set([...state.login, k])] : state.login.filter(x => x !== k);
    save("login", state.login); return renderChrome();
  }
  if (t.dataset.fact) { state.facts[t.dataset.fact] = t.checked; save("facts", state.facts); return render(); }
  if (t.dataset.fmt || t.dataset.cond) {
    const key = t.dataset.fmt ? "fmt" : "cond", v = t.dataset.fmt || t.dataset.cond;
    state.build[key] = t.checked ? [...state.build[key], v] : state.build[key].filter(x => x !== v);
    return updateBuilder();
  }
  if (t.id === "b-role") { state.build.role = t.value; return updateBuilder(); }
  if (t.id === "b-subject") { state.build.subject = t.value; return updateBuilder(); }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "b-ctx") { state.build.ctx = t.value; return updateBuilder(); }
  if (t.id === "b-ask") { state.build.ask = t.value; return updateBuilder(); }
  if (t.id && t.id.startsWith("r-")) { state.review[t.id.slice(2)] = t.value; save("review", state.review); renderChrome(); }
});

render();
</script>
</body>
</html>
